<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="在线算法练习平台，支持多种语言提交评测" />
    <title>Algorithm OJ · 在线算法练习平台</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("practice-platform-theme");
          const selected = preference === "light" || preference === "dark" || preference === "system" ? preference : "dark";
          const resolved = selected === "system" && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : selected === "system" ? "dark" : selected;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.classList.toggle("dark", resolved === "dark");
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
