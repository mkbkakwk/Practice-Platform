name: oj

services:
  db:
    image: postgres:16-alpine
    container_name: oj-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oj}
      POSTGRES_DB: ${POSTGRES_DB:-oj}
    volumes:
      - oj-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oj} -d ${POSTGRES_DB:-oj}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oj-net
    logging: &local-log-rotation
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: oj-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-oj}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-oj}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      # Management UI (optional, for debugging the queue). Remove if not needed.
      - "15672:15672"
    networks:
      - oj-net
    logging: *local-log-rotation

  backend:
    build:
      context: ./backend-spring
    container_name: oj-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-oj}
      POSTGRES_USER: ${POSTGRES_USER:-oj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oj}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-oj}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-oj}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-in-production-must-be-at-least-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PROMOTE_FIRST_ADMIN: ${PROMOTE_FIRST_ADMIN:-false}
      DOC_STORAGE: /app/oj-docs
      APP_GIT_SHA: ${APP_GIT_SHA:-dev}
      APP_VERSION: ${APP_VERSION:-dev}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    # Backend is accessed via the Docker network by the frontend nginx proxy;
    # no host port mapping needed (avoids Windows reserved-port conflicts).
    # To debug directly, run: docker compose exec backend ...
    volumes:
      - oj-docs:/app/oj-docs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:4000/api/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - oj-net
    logging: *local-log-rotation

  # Build-only services. They create the fixed language images used by the
  # Runner, but never become long-running Compose containers.
  sandbox-python-image:
    image: practice-sandbox-python:local
    build:
      context: .
      dockerfile: sandbox-images/python/Dockerfile
    profiles: [sandbox-images]

  sandbox-javascript-image:
    image: practice-sandbox-javascript:local
    build:
      context: .
      dockerfile: sandbox-images/javascript/Dockerfile
    profiles: [sandbox-images]

  sandbox-c-image:
    image: practice-sandbox-c:local
    build:
      context: .
      dockerfile: sandbox-images/native/Dockerfile
    profiles: [sandbox-images]

  sandbox-cpp-image:
    image: practice-sandbox-cpp17:local
    build:
      context: .
      dockerfile: sandbox-images/native/Dockerfile
    profiles: [sandbox-images]

  sandbox-java-image:
    image: practice-sandbox-java:local
    build:
      context: .
      dockerfile: sandbox-images/java/Dockerfile
    profiles: [sandbox-images]

  # Trusted control plane. This is the only application service allowed to
  # reach the Docker Engine. Student code runs in disposable containers with
  # a separate, locked-down HostConfig; it never receives this socket.
  runner:
    build:
      context: ./runner
      target: runtime
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    group_add:
      - "${DOCKER_SOCKET_GID:?DOCKER_SOCKET_GID is required}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=33554432
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN is required}
      RUNNER_SANDBOX_MODE: docker
      RUNNER_INSTANCE_ID: ${RUNNER_INSTANCE_ID:-oj-runner}
      RUNNER_MAX_CONCURRENT_JOBS: ${RUNNER_MAX_CONCURRENCY:-4}
      RUNNER_DOCKER_PYTHON_IMAGE: practice-sandbox-python:local
      RUNNER_DOCKER_JAVASCRIPT_IMAGE: practice-sandbox-javascript:local
      RUNNER_DOCKER_C_IMAGE: practice-sandbox-c:local
      RUNNER_DOCKER_CPP_IMAGE: practice-sandbox-cpp17:local
      RUNNER_DOCKER_JAVA_IMAGE: practice-sandbox-java:local
      RUNNER_DOCKER_PIDS_LIMIT: ${RUNNER_DOCKER_PIDS_LIMIT:-64}
      RUNNER_DOCKER_NANO_CPUS: ${RUNNER_DOCKER_NANO_CPUS:-1000000000}
      RUNNER_DOCKER_WORKSPACE_BYTES: ${RUNNER_DOCKER_WORKSPACE_BYTES:-67108864}
      RUNNER_DOCKER_TMP_BYTES: ${RUNNER_DOCKER_TMP_BYTES:-33554432}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - oj-net
    logging: *local-log-rotation

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
      runner:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=33554432
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-oj}
      POSTGRES_USER: ${POSTGRES_USER:-oj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oj}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-oj}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-oj}
      JUDGE_EXECUTION_MODE: remote
      JUDGE_WORKSPACE: /tmp/oj-judge
      JUDGE_COMPILE_TIMEOUT_MS: ${JUDGE_COMPILE_TIMEOUT_MS:-10000}
      JUDGE_OUTPUT_LIMIT_BYTES: ${JUDGE_OUTPUT_LIMIT_BYTES:-16777216}
      JUDGE_MAX_SOURCE_BYTES: ${JUDGE_MAX_SOURCE_BYTES:-1048576}
      JUDGE_MAX_STDIN_BYTES: ${JUDGE_MAX_STDIN_BYTES:-1048576}
      RUNNER_BASE_URL: http://runner:8080
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN is required}
      RUNNER_CONNECT_TIMEOUT_MS: ${RUNNER_CONNECT_TIMEOUT_MS:-1000}
      RUNNER_READ_TIMEOUT_MS: ${RUNNER_READ_TIMEOUT_MS:-15000}
      RUNNER_MAX_REQUEST_BYTES: ${RUNNER_MAX_REQUEST_BYTES:-4194304}
      RUNNER_MAX_RESPONSE_BYTES: ${RUNNER_MAX_RESPONSE_BYTES:-33554432}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-2}
      WORKER_HEALTH_PORT: 8081
    # Horizontal scale: `docker compose up -d --scale worker=3`
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/api/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - oj-net
    logging: *local-log-rotation

  frontend:
    build:
      context: ./frontend
    container_name: oj-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-8080}:80"
    networks:
      - oj-net
    logging: *local-log-rotation

networks:
  oj-net:
    driver: bridge

volumes:
  oj-pgdata:
  oj-docs:
