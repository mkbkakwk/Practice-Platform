name: practice-platform-sandbox-test

services:
  sandbox-python-image:
    image: practice-sandbox-python:local
    build:
      context: .
      dockerfile: sandbox-images/python/Dockerfile
    profiles: [images]

  sandbox-javascript-image:
    image: practice-sandbox-javascript:local
    build:
      context: .
      dockerfile: sandbox-images/javascript/Dockerfile
    profiles: [images]

  sandbox-c-image:
    image: practice-sandbox-c:local
    build:
      context: .
      dockerfile: sandbox-images/native/Dockerfile
    profiles: [images]

  sandbox-cpp-image:
    image: practice-sandbox-cpp17:local
    build:
      context: .
      dockerfile: sandbox-images/native/Dockerfile
    profiles: [images]

  sandbox-java-image:
    image: practice-sandbox-java:local
    build:
      context: .
      dockerfile: sandbox-images/java/Dockerfile
    profiles: [images]

  runner:
    image: practice-platform-docker-sandbox-runner:local
    build:
      context: ./runner
      target: runtime
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=33554432
    user: "10001:10001"
    group_add:
      - "${DOCKER_SOCKET_GID:?DOCKER_SOCKET_GID is required}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-docker-sandbox-test-token}
      RUNNER_SANDBOX_MODE: docker
      RUNNER_INSTANCE_ID: docker-sandbox-test-runner
      RUNNER_MAX_CONCURRENT_JOBS: ${RUNNER_MAX_CONCURRENT_JOBS:-4}
      RUNNER_DOCKER_PYTHON_IMAGE: practice-sandbox-python:local
      RUNNER_DOCKER_JAVASCRIPT_IMAGE: practice-sandbox-javascript:local
      RUNNER_DOCKER_C_IMAGE: practice-sandbox-c:local
      RUNNER_DOCKER_CPP_IMAGE: practice-sandbox-cpp17:local
      RUNNER_DOCKER_JAVA_IMAGE: practice-sandbox-java:local
      RUNNER_DOCKER_PIDS_LIMIT: ${RUNNER_DOCKER_PIDS_LIMIT:-64}
    ports:
      - "127.0.0.1:${RUNNER_SANDBOX_TEST_PORT:-28080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health | grep -Fq '\"ok\":true,\"sandboxAvailable\":true'"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - runner-control

  runner-docker-security-test:
    build:
      context: ./runner
      target: test
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./test/fixtures/runner:/contracts/runner:ro
    environment:
      RUNNER_CONTRACT_FIXTURE_DIR: /contracts/runner
    command: ["mvn", "-B", "-Pdocker-security", "verify"]

networks:
  runner-control:
    driver: bridge
