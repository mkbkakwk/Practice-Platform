server:
  port: 4000

spring:
  application:
    name: oj-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/oj}
    username: ${POSTGRES_USER:oj}
    password: ${POSTGRES_PASSWORD:oj}
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:oj}
    password: ${RABBITMQ_PASSWORD:oj}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: null

oj:
  jwt:
    secret: ${JWT_SECRET:please-change-this-secret-in-production-must-be-at-least-32-chars}
    expires-in: ${JWT_EXPIRES_IN:7d}
  cors:
    origin: ${CORS_ORIGIN:*}
  promote-first-admin: ${PROMOTE_FIRST_ADMIN:true}
  rabbitmq:
    exchange: oj.judge
    routing-key: oj.judge.submit
    queue: oj.judge.queue

logging:
  level:
    com.oj: INFO
