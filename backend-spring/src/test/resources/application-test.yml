spring:
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "1"
  rabbitmq:
    listener:
      simple:
        auto-startup: false

oj:
  promote-first-admin: false
  rabbitmq:
    exchange: ${OJ_RABBITMQ_EXCHANGE:oj.test.judge}
    routing-key: ${OJ_RABBITMQ_ROUTING_KEY:oj.test.judge.submit}
    queue: ${OJ_RABBITMQ_QUEUE:oj.test.judge.queue}
    retry-exchange: ${OJ_RABBITMQ_RETRY_EXCHANGE:oj.test.judge.retry}
    retry-routing-key: ${OJ_RABBITMQ_RETRY_ROUTING_KEY:oj.test.judge.retry}
    retry-queue: ${OJ_RABBITMQ_RETRY_QUEUE:oj.test.judge.retry.queue}
    retry-delay: 100ms
    dead-letter-exchange: ${OJ_RABBITMQ_DLX:oj.test.judge.dlx}
    dead-letter-routing-key: ${OJ_RABBITMQ_DLQ_ROUTING_KEY:oj.test.judge.dead}
    dead-letter-queue: ${OJ_RABBITMQ_DLQ:oj.test.judge.dlq}
  outbox:
    enabled: false
  doc-storage: ${DOC_STORAGE:/tmp/practice-platform-test-docs}

logging:
  level:
    com.oj: WARN
