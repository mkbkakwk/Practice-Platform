name: practice-platform-judge-reliability-test

services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: reliability_test
      POSTGRES_PASSWORD: reliability_test_password
      POSTGRES_DB: reliability_test
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=268435456
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliability_test -d reliability_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [reliability-test]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: "no"
    environment:
      RABBITMQ_DEFAULT_USER: reliability_test
      RABBITMQ_DEFAULT_PASS: reliability_test_password
    tmpfs:
      - /var/lib/rabbitmq:rw,nosuid,nodev,size=134217728
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [reliability-test]

  backend:
    image: practice-platform-reliability-backend:local
    build:
      context: ./backend-spring
      target: runtime
    restart: "no"
    read_only: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/reliability_test
      POSTGRES_USER: reliability_test
      POSTGRES_PASSWORD: reliability_test_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: reliability_test
      RABBITMQ_PASSWORD: reliability_test_password
      JWT_SECRET: reliability-test-secret-not-for-production-0123456789
      PROMOTE_FIRST_ADMIN: "false"
      OUTBOX_POLL_DELAY_MS: 100
      OUTBOX_INITIAL_RETRY_DELAY: 100ms
      OUTBOX_MAX_RETRY_DELAY: 500ms
      OUTBOX_LEASE: 2s
      OUTBOX_CONFIRM_TIMEOUT: 500ms
      OJ_RABBITMQ_EXCHANGE: reliability.judge
      OJ_RABBITMQ_ROUTING_KEY: reliability.judge.submit
      OJ_RABBITMQ_QUEUE: reliability.judge.queue
      OJ_RABBITMQ_RETRY_EXCHANGE: reliability.judge.retry
      OJ_RABBITMQ_RETRY_ROUTING_KEY: reliability.judge.retry
      OJ_RABBITMQ_RETRY_QUEUE: reliability.judge.retry.queue
      OJ_RABBITMQ_DLX: reliability.judge.dlx
      OJ_RABBITMQ_DLQ_ROUTING_KEY: reliability.judge.dead
      OJ_RABBITMQ_DLQ: reliability.judge.dlq
      JUDGE_RETRY_DELAY: 5s
      DOC_STORAGE: /tmp/oj-docs
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=33554432
      - /tmp/oj-docs:rw,nosuid,nodev,noexec,size=16777216
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4000/api/health"]
      interval: 2s
      timeout: 5s
      retries: 45
    networks: [reliability-test]

  runner:
    image: practice-platform-reliability-runner:local
    build:
      context: ./runner
      target: runtime
    restart: "no"
    read_only: true
    user: "10001:10001"
    group_add:
      - "${DOCKER_SOCKET_GID:?DOCKER_SOCKET_GID is required}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=33554432
    environment:
      RUNNER_TOKEN: reliability-runner-token
      RUNNER_SANDBOX_MODE: docker
      RUNNER_INSTANCE_ID: reliability-runner
      RUNNER_MAX_CONCURRENT_JOBS: 4
      RUNNER_DOCKER_PYTHON_IMAGE: practice-sandbox-python:local
      RUNNER_DOCKER_JAVASCRIPT_IMAGE: practice-sandbox-javascript:local
      RUNNER_DOCKER_C_IMAGE: practice-sandbox-c:local
      RUNNER_DOCKER_CPP_IMAGE: practice-sandbox-cpp17:local
      RUNNER_DOCKER_JAVA_IMAGE: practice-sandbox-java:local
      RUNNER_DOCKER_PIDS_LIMIT: 64
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health | grep -Fq '\"ok\":true,\"sandboxAvailable\":true'"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [reliability-test]

  worker:
    image: practice-platform-reliability-worker:local
    build:
      context: ./worker
      target: runtime
    restart: "no"
    read_only: true
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      runner:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/reliability_test
      POSTGRES_USER: reliability_test
      POSTGRES_PASSWORD: reliability_test_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: reliability_test
      RABBITMQ_PASSWORD: reliability_test_password
      JUDGE_EXECUTION_MODE: remote
      RUNNER_BASE_URL: http://runner:8080
      RUNNER_TOKEN: reliability-runner-token
      RUNNER_CONNECT_TIMEOUT_MS: 500
      RUNNER_READ_TIMEOUT_MS: 15000
      WORKER_CONCURRENCY: 1
      WORKER_MAX_CONCURRENCY: 1
      JUDGE_MAX_RETRIES: 3
      JUDGE_RETRY_DELAY_MS: 5000
      JUDGE_LEASE: 2s
      OJ_RABBITMQ_EXCHANGE: reliability.judge
      OJ_RABBITMQ_ROUTING_KEY: reliability.judge.submit
      OJ_RABBITMQ_QUEUE: reliability.judge.queue
      OJ_RABBITMQ_RETRY_EXCHANGE: reliability.judge.retry
      OJ_RABBITMQ_RETRY_ROUTING_KEY: reliability.judge.retry
      OJ_RABBITMQ_RETRY_QUEUE: reliability.judge.retry.queue
      OJ_RABBITMQ_DLX: reliability.judge.dlx
      OJ_RABBITMQ_DLQ_ROUTING_KEY: reliability.judge.dead
      OJ_RABBITMQ_DLQ: reliability.judge.dlq
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=33554432
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [reliability-test]

networks:
  reliability-test:
    driver: bridge
