name: Docker CI

on:
  push:
    branches:
      - chore/ci-baseline
      - chore/release-hardening
      - codex/feature-foresight
  pull_request:
    branches:
      - codex/feature-foresight
      - main

permissions:
  contents: read

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: practice-platform-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked runtime environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked_runtime_env="$(git ls-files -- .env .env.production .env.staging 'deploy/releases/*.env')"
          if [[ -n "$tracked_runtime_env" ]]; then
            echo "Runtime environment files must not be tracked:" >&2
            printf '%s\n' "$tracked_runtime_env" >&2
            exit 1
          fi

      - name: Run isolated Docker tests, including frontend authentication flows
        run: |
          chmod +x scripts/test-docker.sh
          ./scripts/test-docker.sh
