name: Publish immutable release images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated Git tag to publish
        required: true
        default: v0.4.0-foundation
        type: string
      confirm_package_visibility:
        description: Confirm GHCR visibility and package names were reviewed
        required: true
        default: not-confirmed
        type: choice
        options:
          - not-confirmed
          - confirmed-private-or-approved-public

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit package visibility approval
        env:
          CONFIRM_PACKAGE_VISIBILITY: ${{ inputs.confirm_package_visibility }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_PACKAGE_VISIBILITY" != "confirmed-private-or-approved-public" ]]; then
            echo "Package names and visibility must be explicitly approved before publication." >&2
            exit 1
          fi

  publish:
    needs: release-gate
    runs-on: ubuntu-latest
    environment: ghcr-release
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - component: backend
            context: backend-spring
          - component: worker
            context: worker
          - component: frontend
            context: frontend
    steps:
      - name: Check out the annotated release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Verify annotated tag and resolve source revision
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR with the scoped GitHub token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject existing immutable tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/practice-platform-${{ matrix.component }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE:$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag: $IMAGE:$RELEASE_TAG" >&2
            exit 1
          fi
          if docker manifest inspect "$IMAGE:$SHORT_SHA" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing tag: $IMAGE:$SHORT_SHA" >&2
            exit 1
          fi

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/practice-platform-${{ matrix.component }}:${{ steps.release.outputs.short_sha }}
            ghcr.io/${{ github.repository_owner }}/practice-platform-${{ matrix.component }}:${{ inputs.release_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
          provenance: mode=max
          sbom: true

      - name: Record non-secret image digest
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "component=$COMPONENT" \
            "release_tag=$RELEASE_TAG" \
            "revision=$RELEASE_SHA" \
            "digest=$IMAGE_DIGEST" > "image-digest-$COMPONENT.txt"

      - name: Upload digest for the release manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.component }}
          path: image-digest-${{ matrix.component }}.txt
          if-no-files-found: error
          retention-days: 90
