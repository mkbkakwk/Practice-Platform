server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    max-swallow-size: ${RUNNER_MAX_REQUEST_BYTES:4194304}

spring:
  application:
    name: oj-sandbox-runner
  jackson:
    deserialization:
      fail-on-unknown-properties: true

runner:
  token: ${RUNNER_TOKEN:}
  max-concurrent-jobs: ${RUNNER_MAX_CONCURRENT_JOBS:2}
  max-request-bytes: ${RUNNER_MAX_REQUEST_BYTES:4194304}
  max-source-bytes: ${RUNNER_MAX_SOURCE_BYTES:1048576}
  max-stdin-bytes: ${RUNNER_MAX_STDIN_BYTES:1048576}
  max-cases: ${RUNNER_MAX_CASES:1000}
  max-compile-time-ms: ${RUNNER_MAX_COMPILE_TIME_MS:60000}
  max-run-time-ms: ${RUNNER_MAX_RUN_TIME_MS:10000}
  max-memory-mb: ${RUNNER_MAX_MEMORY_MB:2048}
  max-output-limit-bytes: ${RUNNER_MAX_OUTPUT_LIMIT_BYTES:16777216}

logging:
  level:
    com.oj.runner: INFO
