services:
  test-db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: oj_test
      POSTGRES_USER: oj_test
      POSTGRES_PASSWORD: oj_test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oj_test -d oj_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  test-rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: "no"
    environment:
      RABBITMQ_DEFAULT_USER: oj_test
      RABBITMQ_DEFAULT_PASS: oj_test_password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 10s
      retries: 30

  backend-test:
    build:
      context: ./backend-spring
      target: test
    restart: "no"
    depends_on:
      test-db:
        condition: service_healthy
      test-rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
      DATABASE_URL: jdbc:postgresql://test-db:5432/oj_test
      POSTGRES_USER: oj_test
      POSTGRES_PASSWORD: oj_test_password
      RABBITMQ_HOST: test-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: oj_test
      RABBITMQ_PASSWORD: oj_test_password
      OJ_RABBITMQ_EXCHANGE: oj.test.judge
      OJ_RABBITMQ_ROUTING_KEY: oj.test.judge.submit
      OJ_RABBITMQ_QUEUE: oj.test.judge.queue
      JWT_SECRET: test-only-secret-not-for-production-0123456789
      DOC_STORAGE: /tmp/practice-platform-test-docs
    tmpfs:
      - /tmp/practice-platform-test-docs
    command: ["mvn", "-B", "test"]

  worker-test:
    build:
      context: ./worker
      target: test
      additional_contexts:
        fixtures: ./test/fixtures/runner
    restart: "no"
    depends_on:
      test-db:
        condition: service_healthy
      test-rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
      DATABASE_URL: jdbc:postgresql://test-db:5432/oj_test
      POSTGRES_USER: oj_test
      POSTGRES_PASSWORD: oj_test_password
      RABBITMQ_HOST: test-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: oj_test
      RABBITMQ_PASSWORD: oj_test_password
      OJ_RABBITMQ_EXCHANGE: oj.test.judge
      OJ_RABBITMQ_ROUTING_KEY: oj.test.judge.submit
      OJ_RABBITMQ_QUEUE: oj.test.judge.queue
      JUDGE_EXECUTION_MODE: legacy-local
      JUDGE_WORKSPACE: /tmp/practice-platform-test-judge
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      RUNNER_CONTRACT_FIXTURE_DIR: /contracts/runner
    tmpfs:
      - /tmp/practice-platform-test-judge
    command: ["mvn", "-B", "test"]

  runner-test:
    build:
      context: ./runner
      target: test
      additional_contexts:
        fixtures: ./test/fixtures/runner
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: test
      RUNNER_TOKEN: test-runner-token
      RUNNER_CONTRACT_FIXTURE_DIR: /contracts/runner
    command: ["mvn", "-B", "test"]

  runner-contract:
    build:
      context: ./runner
      target: runtime
      additional_contexts:
        fixtures: ./test/fixtures/runner
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SPRING_PROFILES_ACTIVE: runner-contract-test
      RUNNER_TOKEN: test-runner-token
      RUNNER_MAX_CONCURRENT_JOBS: 1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  worker-runner-contract-test:
    build:
      context: ./worker
      target: test
      additional_contexts:
        fixtures: ./test/fixtures/runner
    restart: "no"
    depends_on:
      runner-contract:
        condition: service_healthy
    environment:
      RUNNER_CONTRACT_BASE_URL: http://runner-contract:8080
      RUNNER_CONTRACT_TOKEN: test-runner-token
      RUNNER_CONTRACT_FIXTURE_DIR: /contracts/runner
    command: ["mvn", "-B", "-Dtest=RemoteSandboxRunnerContractIT", "test"]

  frontend-test:
    build:
      context: ./frontend
      target: test
    restart: "no"
    command: ["sh", "-c", "npm run lint && npm run test && npm run build"]

  release-config-test:
    build:
      context: .
      dockerfile: release-tests/Dockerfile
    restart: "no"
    working_dir: /workspace
    command: ["bash", "scripts/test-release-config.sh"]
